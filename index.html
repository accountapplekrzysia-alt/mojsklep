<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karta Lojalnościowa - Mój Sklep</title>
    <!-- Łączenie z zewnętrznym plikiem CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Biblioteka QR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

<div class="card-container">
    <div class="card-header">
        <h1>Mój Sklep</h1>
        <p>Karta Lojalnościowa & Rabaty</p>
    </div>

    <div class="form-group">
        <label for="idKarty">Numer Karty / ID Klienta:</label>
        <input type="text" id="idKarty" value="MOJ_SKLEP_1001" placeholder="Wpisz ID...">
    </div>

    <button onclick="generujQR()">Wygeneruj Kod QR</button>

    <div id="qr-box">
        <div id="qrcode"></div>
        <p class="info-text">Pokaż ten kod przy kasie, aby aktywować rabat.</p>
    </div>
</div>

<script>
    function generujQR() {
        const inputVal = document.getElementById("idKarty").value.trim();
        const qrContainer = document.getElementById("qrcode");
        
        if (!inputVal) {
            alert("Proszę wpisać numer karty!");
            return;
        }

        qrContainer.innerHTML = "";
        const trescKodu = "KARTA:" + inputVal;

        new QRCode(qrContainer, {
            text: trescKodu,
            width: 180,
            height: 180,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });
    }

    window.onload = generujQR;
</script>

</body>
</html>
